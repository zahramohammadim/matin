<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATIN • 365 VIP BLACK PASS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
         :root {
            --bg: #07080a;
            --gold: #e2c079;
            --text: #f4f4f6;
            --red: #ff4d4d;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .wrapper {
            width: 100%;
            max-width: 400px;
        }
        
        .ticket-card {
            background: linear-gradient(160deg, #15161c 0%, #0c0d11 100%);
            border: 1px solid #222;
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        
        .is-burned {
            filter: grayscale(1) brightness(0.3);
            border-color: var(--red);
            transform: scale(0.95);
        }
        
        .is-burned .ticket-icon {
            filter: blur(4px);
            opacity: 0.3;
        }
        
        .ticket-icon {
            font-size: 60px;
            margin-bottom: 15px;
            transition: 0.5s;
        }
        
        .ticket-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        
        .ticket-subtitle {
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 25px;
            opacity: 0.8;
        }
        
        .status-badge {
            font-size: 10px;
            padding: 6px 16px;
            border-radius: 100px;
            display: inline-block;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .status-locked {
            color: #888;
            border: 1px solid #333;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .status-active {
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.05);
        }
        
        .status-burned {
            color: var(--red);
            border: 1px solid var(--red);
            background: rgba(255, 77, 77, 0.05);
        }
        
        .content-box {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            transition: all 0.5s ease;
        }
        
        .unlock-msg {
            font-size: 14px;
            color: #555;
            font-style: italic;
        }
        
        .reveal-text {
            font-size: 15px;
            line-height: 1.8;
            color: #e0e0e0;
            animation: reveal 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-claim {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f3d48d, #c49d47);
            border: none;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        
        .btn-claim:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(226, 192, 121, 0.3);
        }
        
        .btn-claim:disabled {
            background: #1a1b21;
            color: #444;
            cursor: not-allowed;
        }
        
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0;
        }
        
        .nav-btn {
            background: #121318;
            border: 1px solid #333;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .nav-btn:hover {
            background: #1e1f26;
            border-color: var(--gold);
        }
        
        .dots {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
        }
        
        .rules-section {
            margin-top: 25px;
            background: #101116;
            border-radius: 25px;
            text-align: right;
        }
        
        summary {
            padding: 18px;
            color: var(--gold);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            list-style: none;
        }
        
        .rules-content {
            padding: 0 20px 20px 20px;
            font-size: 12px;
            color: #777;
            line-height: 1.9;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="ticket-card" id="ticketCard">
            <div class="ticket-icon" id="ticketIcon">🎬</div>
            <h2 class="ticket-title" id="ticketTitle">...</h2>
            <div class="ticket-subtitle" id="ticketSubtitle">...</div>

            <div id="status" class="status-badge status-locked">SCAN TO UNLOCK</div>

            <div class="content-box" id="contentBox">
                <span class="unlock-msg">اسکن کن تا سورپرایزت رو ببینی! 😉</span>
            </div>

            <button class="btn-claim" id="claimBtn" disabled>Redeem This Pass</button>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="prev()">←</button>
            <span class="dots" id="counter">1 / 12</span>
            <button class="nav-btn" onclick="next()">→</button>
        </div>

        <details class="rules-section">
            <summary>📜 قوانین VIP (حتماً بخون!)</summary>
            <div class="rules-content">
                • هر کارت فقط یک‌بار قابل استفاده است.<br> • سوزاندن کارت‌ها فقط با تایید مدیریت (Zahra) امکان‌پذیر است.<br> • کارت‌ها تا ۳۶۵ روز اعتبار دارند.<br> • کارت شماره ۱۲ (جوکر) حق انتخاب بی‌حد و مرز به شما می‌دهد!
            </div>
        </details>
    </div>

    <script>
        const tickets = [{
            id: 1,
            icon: "🎬",
            title: "Cosy Movie Night",
            fa: "شبِ فیلم و سینمای دنج",
            desc: "کنترل دست توئه، ولی انتخاب فیلم با منه! (شوخی کردم، هرچی تو بگی). قول میدم وسط فیلم نخوابم و فقط با هم پاپ‌کورن بخوریم. ❤️"
        }, {
            id: 2,
            icon: "🎟️",
            title: "Big Screen Cinema",
            fa: "پرده نقره‌ای و سینما",
            desc: "سینما با تو یعنی: من می‌چسبم بهت، تو به فیلم نگاه می‌کنی! فقط حواست باشه وسطش یهو داد نزنی همه نگامون کنن! 😂"
        }, {
            id: 3,
            icon: "🌊",
            title: "Aqua & Spa Retreat",
            fa: "استخر، سونا و جکوزی",
            desc: "یه ریلکسیشن تمام‌عیار. قول میدم انقدر بهت برسه که یادت بره کار چیه. فقط لطفاً توی استخر باهام مسابقه نذار، من کم میارم! 💦"
        }, {
            id: 4,
            icon: "👑",
            title: "The Yes Day",
            fa: "روزِ «چشم قربان»",
            desc: "برای ۲۴ ساعت، تو پادشاهی و من وزیر. هرچی بگی فقط میگم چشم! (آره، حتی شستن ظرفا اگه هوس کردی!) 👸"
        }, {
            id: 5,
            icon: "🎲",
            title: "Cafe & Board Games",
            fa: "کافه و بازی‌های رومیزی",
            desc: "کافه + بازی + کل‌کل! می‌بریم که باختت رو ببینم و باهات کری بخونم. قهوه مهمونِ منی، ولی بردِ بازی با منه! ☕"
        }, {
            id: 6,
            icon: "✈️",
            title: "Getaway Escape",
            fa: "سفرِ ناگهانی",
            desc: "همین الان چمدون ببند که داریم می‌ریم یه جایی که هیچ‌کس پیدامون نکنه. گوشی‌ها خاموش، فقط من و تو و جاده! 🚗"
        }, {
            id: 7,
            icon: "🌌",
            title: "Stargazing & Rooftop",
            fa: "رصدِ ستاره‌ها",
            desc: "رو پشت‌بوم دراز می‌کشیم و من سعی می‌کنم صورت فلکی‌ها رو برات اشتباهی توضیح بدم و تو هم الکی تایید کنی! ✨"
        }, {
            id: 8,
            icon: "🎡",
            title: "Luna Park Rush",
            fa: "شهربازی و هیجان",
            desc: "قراره از ترس جیغ بکشیم. اگه دیدی دارم از ترس سکته می‌کنم، لطفاً دستم رو سفت بگیر که پرت نشم پایین! 🎢"
        }, {
            id: 9,
            icon: "🥩",
            title: "Gourmet Dinner",
            fa: "شامِ مجلل",
            desc: "لباس شیک بپوش که قراره بریم جایی که قاشق چنگال‌هاش از گوشی من گرون‌تره. هر چی گرون‌تر، خوشمزه‌تر! 🥂"
        }, {
            id: 10,
            icon: "🐠",
            title: "Deep Sea Aquarium",
            fa: "تونل آکواریوم",
            desc: "میریم اون پایین که ماهی‌ها رو ببینیم. قول میدم اونجا سعی نکنم به ماهی‌ها اسم بدم و باهاشون حرف بزنم! 🐟"
        }, {
            id: 11,
            icon: "🏎️",
            title: "Go-Kart Grand Prix",
            fa: "مسابقه کارتینگ",
            desc: "اینجا دیگه خبری از رانندگی آروم نیست. گاز بده که قراره گرد و خاک کنیم. (اگه اول شدی، افتخارش مال منه!) 🏁"
        }, {
            id: 12,
            icon: "🃏",
            title: "Wildcard Wish",
            fa: "کارتِ جوکرِ طلایی",
            desc: "این کارت حکمِ تیرِ خلاص رو داره. هر چی تو دلت مونده رو کن، من در خدمتم! هر آرزویی... 🌟"
        }];

        const urlParams = new URLSearchParams(window.location.search);
        const scannedId = parseInt(urlParams.get('id')) || 1;
        let idx = scannedId - 1;

        function render() {
            const t = tickets[idx];
            const card = document.getElementById('ticketCard');
            const status = document.getElementById('status');
            const contentBox = document.getElementById('contentBox');
            const claimBtn = document.getElementById('claimBtn');
            const burned = localStorage.getItem('burned_' + t.id);

            document.getElementById('ticketIcon').innerText = t.icon;
            document.getElementById('ticketTitle').innerText = t.title;
            document.getElementById('ticketSubtitle').innerText = t.fa;
            document.getElementById('counter').innerText = `${idx + 1} / 12`;

            // Reset Card State
            card.classList.remove('is-burned');

            if (burned) {
                card.classList.add('is-burned');
                status.innerText = "BURNED ✕";
                status.className = "status-badge status-burned";
                contentBox.innerHTML = `<span class="reveal-text">استفاده شده در:<br>${burned}</span>`;
                claimBtn.disabled = true;
                claimBtn.innerText = "EXPIRED";
            } else if (scannedId === t.id) {
                status.innerText = "READY TO REDEEM";
                status.className = "status-badge status-active";
                contentBox.innerHTML = `<p class="reveal-text">${t.desc}</p>`;
                claimBtn.disabled = false;
                claimBtn.innerText = "Redeem & Burn This Pass";
                claimBtn.onclick = () => {
                    if (prompt("رمز ادمین؟ (فقط برای زهرا!)") === "Zahra") {
                        localStorage.setItem('burned_' + t.id, new Date().toLocaleString('fa-IR'));
                        confetti({
                            particleCount: 150,
                            spread: 70,
                            origin: {
                                y: 0.6
                            }
                        });
                        render();
                    }
                };
            } else {
                status.innerText = "SCAN TO UNLOCK";
                status.className = "status-badge status-locked";
                contentBox.innerHTML = `<span class="unlock-msg">اسکن کن تا سورپرایزت رو ببینی! 😉</span>`;
                claimBtn.disabled = true;
                claimBtn.innerText = "Locked";
            }
        }

        function next() {
            idx = (idx + 1) % 12;
            render();
        }

        function prev() {
            idx = (idx - 1 + 12) % 12;
            render();
        }

        render();
    </script>
</body>

</html>
